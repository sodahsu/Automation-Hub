name: Private CI Bridge (read-only)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/private-ci.yml'
      - 'scripts/common/**'
  workflow_dispatch:
    inputs:
      target:
        description: Public-safe target alias
        required: true
        type: choice
        options:
          - repo-01
          - repo-02
          - repo-03
          - repo-04
          - repo-05
          - repo-06
      sha:
        description: Optional 40-char commit SHA (PR head verification). Empty means default branch.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  # 在任何網路請求之前先驗證輸入；驗證失敗整條 workflow 直接停。
  resolve:
    name: Resolve run mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Validate inputs and select mode
        id: mode
        env:
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${INPUT_SHA}" ]]; then
            echo "mode=default" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ ! "${INPUT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid input::sha must be a 40-character lowercase hex commit SHA."
            exit 1
          fi

          if [[ "${INPUT_TARGET}" == "repo-06" ]]; then
            echo "::error title=Unsupported target::repo-06 does not support PR mode."
            exit 1
          fi

          echo "mode=pr" >> "${GITHUB_OUTPUT}"

  # status token 只存在於 mark-pending 與 report；執行 private 程式碼的 ci job 拿不到。
  mark-pending:
    name: Mark PR status pending
    needs: resolve
    if: ${{ needs.resolve.outputs.mode == 'pr' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write pending commit status
        env:
          PRIVATE_REPOS_JSON: ${{ secrets.PRIVATE_REPOS_JSON }}
          STATUS_TOKEN: ${{ secrets.PRIVATE_REPOS_STATUS_TOKEN }}
          TARGET_ALIAS: ${{ inputs.target }}
          HEAD_SHA: ${{ inputs.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          umask 077

          if [[ -z "${STATUS_TOKEN}" ]]; then
            echo "::error title=Missing secret::PRIVATE_REPOS_STATUS_TOKEN is not configured."
            exit 1
          fi

          private_repo="$(jq -er --arg alias "${TARGET_ALIAS}" '.[$alias] | select(type == "string" and length > 0)' <<<"${PRIVATE_REPOS_JSON}")"

          if [[ ! "${private_repo}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error title=Invalid target mapping::The selected alias does not resolve to a valid repository identifier."
            exit 1
          fi

          echo "::add-mask::${private_repo}"

          payload="$(jq -cn --arg url "${TARGET_URL}" \
            '{state:"pending",context:"automation-hub/private-ci",description:"Public CI is running",target_url:$url}')"
          out_file="${RUNNER_TEMP}/status-pending.json"

          http_code="$(curl --silent --location \
            --output "${out_file}" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${STATUS_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${private_repo}/statuses/${HEAD_SHA}" \
            --data "${payload}")"
          rm -f "${out_file}"

          if [[ ! "${http_code}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error title=Status write failed::Unable to write pending status (HTTP ${http_code})."
            exit 1
          fi

  ci:
    name: CI — ${{ matrix.target }}${{ needs.resolve.outputs.mode == 'pr' && ' · PR' || '' }}
    needs: [resolve, mark-pending]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.mark-pending.result == 'success' || needs.mark-pending.result == 'skipped') }}
    outputs:
      ci_outcome: ${{ steps.publish.outputs.ci_outcome }}
      pass_count: ${{ steps.publish.outputs.pass_count }}
      fail_count: ${{ steps.publish.outputs.fail_count }}
      skip_count: ${{ steps.publish.outputs.skip_count }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.target) || '["repo-01","repo-02","repo-03","repo-04","repo-05","repo-06"]') }}
    concurrency:
      group: private-ci-${{ matrix.target }}${{ needs.resolve.outputs.mode == 'pr' && format('-{0}', inputs.sha) || '' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Automation Hub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preflight required secrets
        env:
          PRIVATE_REPOS_JSON: ${{ secrets.PRIVATE_REPOS_JSON }}
          PRIVATE_REPOS_READ_TOKEN: ${{ secrets.PRIVATE_REPOS_READ_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${PRIVATE_REPOS_JSON}" ]]; then
            echo "::error title=Missing secret::PRIVATE_REPOS_JSON is not configured."
            exit 1
          fi

          if [[ -z "${PRIVATE_REPOS_READ_TOKEN}" ]]; then
            echo "::error title=Missing secret::PRIVATE_REPOS_READ_TOKEN is not configured."
            exit 1
          fi

          if ! jq -e 'type == "object"' >/dev/null <<<"${PRIVATE_REPOS_JSON}"; then
            echo "::error title=Invalid secret::PRIVATE_REPOS_JSON must be a JSON object."
            exit 1
          fi

      - name: Resolve and clone private target
        env:
          TARGET_ALIAS: ${{ matrix.target }}
          PRIVATE_REPOS_JSON: ${{ secrets.PRIVATE_REPOS_JSON }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPOS_READ_TOKEN }}
          RUN_MODE: ${{ needs.resolve.outputs.mode }}
          HEAD_SHA: ${{ inputs.sha }}
        run: |
          set -Eeuo pipefail
          umask 077

          private_repo="$(jq -er --arg alias "${TARGET_ALIAS}" '.[$alias] | select(type == "string" and length > 0)' <<<"${PRIVATE_REPOS_JSON}")"

          if [[ ! "${private_repo}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error title=Invalid target mapping::The selected alias does not resolve to a valid repository identifier."
            exit 1
          fi

          echo "::add-mask::${private_repo}"

          rm -rf workspace

          if [[ "${TARGET_ALIAS}" == "repo-06" ]]; then
            # repo-06 is large. Match its private Vault Health sparse checkout
            # instead of downloading the full repository archive.
            askpass="${RUNNER_TEMP}/automation-hub-git-askpass.sh"
            printf '%s\n' \
              '#!/usr/bin/env bash' \
              'case "$1" in' \
              '  *Username*) printf "%s\\n" "x-access-token" ;;' \
              '  *Password*) printf "%s\\n" "${GH_TOKEN}" ;;' \
              '  *) exit 1 ;;' \
              'esac' > "${askpass}"
            chmod 700 "${askpass}"

            GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
              git clone --depth 1 --filter=blob:none --sparse --no-tags \
              "https://github.com/${private_repo}.git" workspace

            # Partial clone may lazily fetch blobs while materializing the sparse
            # checkout, so keep read-only auth only for this one fetch-capable step.
            GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
              git -C workspace sparse-checkout set \
              .agents .claude .kiro 00_Inbox 10_Action 20_Knowledge 30_Sources 90_System 99_Archive

            rm -f "${askpass}"

            # Keep local Git metadata because Vault Health uses git ls-files,
            # but remove every remote so later CI has no repository write path.
            git -C workspace remote remove origin || true
            git -C workspace config --unset-all http.https://github.com/.extraheader 2>/dev/null || true
            echo "Private target sparse checkout completed with read-only Git access."
          else
            mkdir -p workspace

            # Phase 1 is strictly read-only. Use the repository archive API, which
            # requires only Contents: Read for a fine-grained PAT.
            archive="${RUNNER_TEMP}/private-repo.tar.gz"
            tarball_url="https://api.github.com/repos/${private_repo}/tarball"
            if [[ "${RUN_MODE}" == "pr" ]]; then
              tarball_url="${tarball_url}/${HEAD_SHA}"
            fi
            http_code="$(curl --silent --show-error --location \
              --output "${archive}" \
              --write-out "%{http_code}" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "${tarball_url}")"

            if [[ "${http_code}" != "200" ]]; then
              rm -f "${archive}"
              echo "::error title=Private repository access denied::Read-only archive request returned HTTP ${http_code}. Verify the fine-grained token includes this repository and Contents: Read."
              exit 1
            fi

            tar -xzf "${archive}" -C workspace --strip-components=1
            rm -f "${archive}"

            echo "Private target checkout completed with read-only archive access."
          fi

      - name: Set up Node 20 runtime for repo-05
        if: ${{ matrix.target == 'repo-05' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20.19.0'
          package-manager-cache: false

      - name: Set up Node 22 runtime
        if: ${{ matrix.target != 'repo-05' && hashFiles('workspace/package.json') != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Run sanitized repository-native CI
        id: private_ci
        continue-on-error: true
        run: |
          set -Eeuo pipefail

          # Private repository tooling must not write directly to public Actions
          # command files. Give child processes isolated temporary sinks instead.
          private_cmd_dir="${RUNNER_TEMP}/private-ci-command-files"
          mkdir -p "${private_cmd_dir}"
          chmod 700 "${private_cmd_dir}"

          export GITHUB_STEP_SUMMARY="${private_cmd_dir}/step-summary.md"
          export GITHUB_OUTPUT="${private_cmd_dir}/output.txt"
          export GITHUB_ENV="${private_cmd_dir}/env.txt"
          export GITHUB_PATH="${private_cmd_dir}/path.txt"

          : > "${GITHUB_STEP_SUMMARY}"
          : > "${GITHUB_OUTPUT}"
          : > "${GITHUB_ENV}"
          : > "${GITHUB_PATH}"

          bash scripts/common/run-ci.sh workspace "${RUNNER_TEMP}/ci-summary.md" "${{ matrix.target }}"

      - name: Publish sanitized summary
        id: publish
        if: ${{ always() }}
        env:
          PRIVATE_CI_OUTCOME: ${{ steps.private_ci.outcome }}
        run: |
          set -Eeuo pipefail

          # 只輸出列舉值與數字給 report job，不帶任何 private 內容。
          pass_count=0
          fail_count=0
          skip_count=0
          summary_file="${RUNNER_TEMP}/ci-summary.md"
          if [[ ! -s "${summary_file}" ]]; then
            echo "::error title=Missing CI summary::Private CI completed without a sanitized stage summary."
            exit 1
          fi
          pass_count="$(awk -F'|' '$3 ~ /^[[:space:]]*PASS([[:space:]]|$)/ { count++ } END { print count + 0 }' "${summary_file}")"
          fail_count="$(awk -F'|' '$3 ~ /^[[:space:]]*FAIL([[:space:]]|$)/ { count++ } END { print count + 0 }' "${summary_file}")"
          skip_count="$(awk -F'|' '$3 ~ /^[[:space:]]*SKIP([[:space:]]|$)/ { count++ } END { print count + 0 }' "${summary_file}")"
          {
            echo "ci_outcome=${PRIVATE_CI_OUTCOME}"
            echo "pass_count=${pass_count}"
            echo "fail_count=${fail_count}"
            echo "skip_count=${skip_count}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Target"
            echo
            echo "${{ matrix.target }}"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ -f "${RUNNER_TEMP}/ci-summary.md" ]]; then
            cat "${RUNNER_TEMP}/ci-summary.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "CI summary was not produced." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Cleanup private workspace
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          rm -rf workspace
          rm -rf "${RUNNER_TEMP}/private-ci-command-files"
          rm -f "${RUNNER_TEMP}"/automation-hub-*.log "${RUNNER_TEMP}/ci-summary.md" "${RUNNER_TEMP}/automation-hub-git-askpass.sh" 2>/dev/null || true

      - name: Fail workflow when private CI failed
        if: ${{ steps.private_ci.outcome == 'failure' }}
        run: |
          echo "::error title=Private CI failed::One or more repository-native CI stages failed."
          exit 1

  report:
    name: Report PR status
    needs: [resolve, ci]
    if: ${{ always() && needs.resolve.outputs.mode == 'pr' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write final commit status
        env:
          PRIVATE_REPOS_JSON: ${{ secrets.PRIVATE_REPOS_JSON }}
          STATUS_TOKEN: ${{ secrets.PRIVATE_REPOS_STATUS_TOKEN }}
          TARGET_ALIAS: ${{ inputs.target }}
          HEAD_SHA: ${{ inputs.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_RESULT: ${{ needs.ci.result }}
          CI_OUTCOME: ${{ needs.ci.outputs.ci_outcome }}
          PASS_COUNT: ${{ needs.ci.outputs.pass_count }}
          FAIL_COUNT: ${{ needs.ci.outputs.fail_count }}
          SKIP_COUNT: ${{ needs.ci.outputs.skip_count }}
        run: |
          set -Eeuo pipefail
          umask 077

          if [[ -z "${STATUS_TOKEN}" ]]; then
            echo "::error title=Missing secret::PRIVATE_REPOS_STATUS_TOKEN is not configured."
            exit 1
          fi

          # private_ci step 是 continue-on-error，成敗看 step outcome 而非 job result。
          # ci job 取消、取得原始碼失敗或沒有 output 時一律 error，不留在 pending。
          state="error"
          description="Public CI did not complete"
          if [[ "${CI_OUTCOME}" == "failure" ]]; then
            state="failure"
            description="Public CI failed"
          elif [[ "${CI_OUTCOME}" == "success" && "${CI_RESULT}" == "success" ]]; then
            state="success"
            description="Public CI passed"
          fi

          if [[ "${PASS_COUNT}" =~ ^[0-9]{1,4}$ && "${FAIL_COUNT}" =~ ^[0-9]{1,4}$ && "${SKIP_COUNT}" =~ ^[0-9]{1,4}$ && "${state}" != "error" ]]; then
            description="${description}: PASS ${PASS_COUNT} / FAIL ${FAIL_COUNT} / SKIP ${SKIP_COUNT}"
          fi

          private_repo="$(jq -er --arg alias "${TARGET_ALIAS}" '.[$alias] | select(type == "string" and length > 0)' <<<"${PRIVATE_REPOS_JSON}")"

          if [[ ! "${private_repo}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error title=Invalid target mapping::The selected alias does not resolve to a valid repository identifier."
            exit 1
          fi

          echo "::add-mask::${private_repo}"

          payload="$(jq -cn --arg state "${state}" --arg desc "${description:0:140}" --arg url "${TARGET_URL}" \
            '{state:$state,context:"automation-hub/private-ci",description:$desc,target_url:$url}')"
          out_file="${RUNNER_TEMP}/status-final.json"

          http_code="$(curl --silent --location \
            --output "${out_file}" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${STATUS_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${private_repo}/statuses/${HEAD_SHA}" \
            --data "${payload}")"
          rm -f "${out_file}"

          if [[ ! "${http_code}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error title=Status write failed::Unable to write ${state} status (HTTP ${http_code})."
            exit 1
          fi

