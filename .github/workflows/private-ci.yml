name: Private CI Bridge (read-only)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/private-ci.yml'
      - 'scripts/common/**'
  workflow_dispatch:
    inputs:
      target:
        description: Public-safe target alias
        required: true
        type: choice
        options:
          - repo-01
          - repo-02
          - repo-03
          - repo-04
          - repo-05
          - repo-06
      mode:
        description: CI provenance mode
        required: false
        default: baseline
        type: choice
        options:
          - baseline
          - pr-exact-sha
      pr_number:
        description: Open PR number for repo-04 pr-exact-sha mode
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  ci:
    name: ${{ inputs.mode == 'pr-exact-sha' && 'PR CI — ' || 'CI — ' }}${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.target) || '["repo-01","repo-02","repo-03","repo-04","repo-05","repo-06"]') }}
    concurrency:
      group: private-ci-${{ matrix.target }}-${{ inputs.mode || 'baseline' }}
      cancel-in-progress: false
    runs-on: [self-hosted, private-ci]
    timeout-minutes: 60

    steps:
      - name: Checkout Automation Hub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require reviewed Hub main ref
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail
          if [[ "${WORKFLOW_REF}" != "refs/heads/main" ]]; then
            echo "::error title=Unreviewed workflow ref::Private CI may run only from Automation-Hub main."
            exit 1
          fi

      - name: Preflight required secrets
        env:
          PRIVATE_REPOS_JSON: ${{ secrets.PRIVATE_REPOS_JSON }}
          PRIVATE_REPOS_READ_TOKEN: ${{ secrets.PRIVATE_REPOS_READ_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${PRIVATE_REPOS_JSON}" ]]; then
            echo "::error title=Missing secret::PRIVATE_REPOS_JSON is not configured."
            exit 1
          fi

          if [[ -z "${PRIVATE_REPOS_READ_TOKEN}" ]]; then
            echo "::error title=Missing secret::PRIVATE_REPOS_READ_TOKEN is not configured."
            exit 1
          fi

          if ! jq -e 'type == "object"' >/dev/null <<<"${PRIVATE_REPOS_JSON}"; then
            echo "::error title=Invalid secret::PRIVATE_REPOS_JSON must be a JSON object."
            exit 1
          fi

      - name: Resolve and clone private target
        env:
          TARGET_ALIAS: ${{ matrix.target }}
          TARGET_MODE: ${{ inputs.mode || 'baseline' }}
          PR_NUMBER: ${{ inputs.pr_number || '' }}
          PRIVATE_REPOS_JSON: ${{ secrets.PRIVATE_REPOS_JSON }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPOS_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          umask 077

          private_repo="$(jq -er --arg alias "${TARGET_ALIAS}" '.[$alias] | select(type == "string" and length > 0)' <<<"${PRIVATE_REPOS_JSON}")"

          if [[ ! "${private_repo}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error title=Invalid target mapping::The selected alias does not resolve to a valid repository identifier."
            exit 1
          fi
          if [[ "${TARGET_MODE}" != "baseline" && "${TARGET_MODE}" != "pr-exact-sha" ]]; then
            echo "::error title=Invalid CI mode::Unsupported private CI mode."
            exit 1
          fi
          if [[ "${TARGET_MODE}" == "pr-exact-sha" && "${TARGET_ALIAS}" != "repo-04" ]]; then
            echo "::error title=Unsupported PR mode target::PR exact-SHA mode is currently limited to repo-04."
            exit 1
          fi
          if [[ "${TARGET_MODE}" == "baseline" && -n "${PR_NUMBER}" ]]; then
            echo "::error title=Invalid CI request::A PR number requires pr-exact-sha mode."
            exit 1
          fi
          if [[ "${TARGET_MODE}" == "pr-exact-sha" && ! "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=Invalid PR request::PR exact-SHA mode requires a positive numeric PR number."
            exit 1
          fi

          echo "::add-mask::${private_repo}"

          api_headers=(
            --header "Accept: application/vnd.github+json"
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header "X-GitHub-Api-Version: 2026-03-10"
          )
          metadata="${RUNNER_TEMP}/private-repo-metadata.json"
          metadata_code="$(curl --silent --show-error --location \
            --output "${metadata}" \
            --write-out "%{http_code}" \
            "${api_headers[@]}" \
            "https://api.github.com/repos/${private_repo}")"
          if [[ "${metadata_code}" != "200" ]]; then
            rm -f "${metadata}"
            echo "::error title=Private repository metadata unavailable::Read-only metadata request failed."
            exit 1
          fi

          default_branch="$(jq -r '.default_branch // empty' "${metadata}")"
          if [[ -z "${default_branch}" ]]; then
            rm -f "${metadata}"
            echo "::error title=Private repository metadata invalid::The target default branch is unavailable."
            exit 1
          fi

          target_ref="${default_branch}"
          pr_metadata=""
          if [[ "${TARGET_MODE}" == "pr-exact-sha" ]]; then
            pr_metadata="${RUNNER_TEMP}/private-repo-pr-${PR_NUMBER}.json"
            pr_code="$(curl --silent --show-error --location \
              --output "${pr_metadata}" \
              --write-out "%{http_code}" \
              "${api_headers[@]}" \
              "https://api.github.com/repos/${private_repo}/pulls/${PR_NUMBER}")"
            pr_state="$(jq -r '.state // empty' "${pr_metadata}")"
            merged_at="$(jq -r '.merged_at // empty' "${pr_metadata}")"
            base_repo="$(jq -r '.base.repo.full_name // empty' "${pr_metadata}")"
            base_ref="$(jq -r '.base.ref // empty' "${pr_metadata}")"
            head_repo="$(jq -r '.head.repo.full_name // empty' "${pr_metadata}")"
            head_sha="$(jq -r '.head.sha // empty' "${pr_metadata}")"
            if [[ "${pr_code}" != "200" || "${pr_state}" != "open" || -n "${merged_at}" \
              || "${base_repo}" != "${private_repo}" || "${base_ref}" != "${default_branch}" \
              || "${head_repo}" != "${private_repo}" || ! "${head_sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              rm -f "${metadata}" "${pr_metadata}"
              echo "::error title=Invalid PR request::The PR must be open, same-repository, and target the default branch."
              exit 1
            fi
            target_ref="${head_sha}"
            echo "::add-mask::${target_ref}"
            printf '%s' "${target_ref}" > "${RUNNER_TEMP}/private-pr-head.sha"
            chmod 600 "${RUNNER_TEMP}/private-pr-head.sha"
          fi

          rm -f "${metadata}"
          [[ -z "${pr_metadata}" ]] || rm -f "${pr_metadata}"
          rm -rf workspace

          if [[ "${TARGET_ALIAS}" == "repo-06" ]]; then
            if [[ "${TARGET_MODE}" == "pr-exact-sha" ]]; then
              echo "::error title=Unsupported PR mode target::repo-06 remains default-branch-only until its sparse PR checkout is reviewed."
              exit 1
            fi
            # repo-06 is large. Match its private Vault Health sparse checkout
            # instead of downloading the full repository archive.
            askpass="${RUNNER_TEMP}/automation-hub-git-askpass.sh"
            printf '%s\n' \
              '#!/usr/bin/env bash' \
              'case "$1" in' \
              '  *Username*) printf "%s\\n" "x-access-token" ;;' \
              '  *Password*) printf "%s\\n" "${GH_TOKEN}" ;;' \
              '  *) exit 1 ;;' \
              'esac' > "${askpass}"
            chmod 700 "${askpass}"
            GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
              git clone --depth 1 --filter=blob:none --sparse --no-tags \
              "https://github.com/${private_repo}.git" workspace
            GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
              git -C workspace sparse-checkout set \
              .agents .claude 00_Inbox 10_Action 20_Knowledge 30_Sources 90_System 99_Archive
            rm -f "${askpass}"
            git -C workspace remote remove origin || true
            git -C workspace config --unset-all http.https://github.com/.extraheader 2>/dev/null || true
            echo "Private target ${TARGET_MODE} sparse checkout completed with read-only Git access."
          else
            mkdir -p workspace
            archive="${RUNNER_TEMP}/private-repo.tar.gz"
            http_code="$(curl --silent --show-error --location \
              --output "${archive}" \
              --write-out "%{http_code}" \
              "${api_headers[@]}" \
              "https://api.github.com/repos/${private_repo}/tarball/${target_ref}")"
            if [[ "${http_code}" != "200" ]]; then
              rm -f "${archive}"
              echo "::error title=Private repository access denied::Read-only archive request failed."
              exit 1
            fi
            tar -xzf "${archive}" -C workspace --strip-components=1
            rm -f "${archive}"
            echo "Private target ${TARGET_MODE} checkout completed with read-only archive access."
          fi

      - name: Set up Node 20 runtime for repo-05
        if: ${{ matrix.target == 'repo-05' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20.19.0'
          package-manager-cache: false

      - name: Set up Node 22 runtime
        if: ${{ matrix.target != 'repo-05' && hashFiles('workspace/package.json') != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Run sanitized repository-native CI
        id: private_ci
        continue-on-error: true
        run: |
          set -Eeuo pipefail

          # Private repository tooling must not write directly to public Actions
          # command files. Give child processes isolated temporary sinks instead.
          private_cmd_dir="${RUNNER_TEMP}/private-ci-command-files"
          mkdir -p "${private_cmd_dir}"
          chmod 700 "${private_cmd_dir}"

          export GITHUB_STEP_SUMMARY="${private_cmd_dir}/step-summary.md"
          export GITHUB_OUTPUT="${private_cmd_dir}/output.txt"
          export GITHUB_ENV="${private_cmd_dir}/env.txt"
          export GITHUB_PATH="${private_cmd_dir}/path.txt"

          : > "${GITHUB_STEP_SUMMARY}"
          : > "${GITHUB_OUTPUT}"
          : > "${GITHUB_ENV}"
          : > "${GITHUB_PATH}"

          bash scripts/common/run-ci.sh workspace "${RUNNER_TEMP}/ci-summary.md" "${{ matrix.target }}"

      - name: Verify private PR head stability
        id: pr_stability
        if: ${{ inputs.mode == 'pr-exact-sha' }}
        continue-on-error: true
        env:
          TARGET_ALIAS: ${{ matrix.target }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PRIVATE_REPOS_JSON: ${{ secrets.PRIVATE_REPOS_JSON }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPOS_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          private_repo="$(jq -er --arg alias "${TARGET_ALIAS}" '.[$alias] | select(type == "string" and length > 0)' <<<"${PRIVATE_REPOS_JSON}")"
          echo "::add-mask::${private_repo}"
          expected_sha="$(tr -d '\\r\\n' < "${RUNNER_TEMP}/private-pr-head.sha")"
          metadata="${RUNNER_TEMP}/private-repo-pr-after.json"
          http_code="$(curl --silent --show-error --location \
            --output "${metadata}" \
            --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${private_repo}/pulls/${PR_NUMBER}")"
          current_sha="$(jq -r '.head.sha // empty' "${metadata}")"
          rm -f "${metadata}"
          if [[ "${http_code}" != "200" || ! "${current_sha}" =~ ^[0-9a-fA-F]{40}$ || "${current_sha}" != "${expected_sha}" ]]; then
            echo "::error title=Private PR head changed::The PR head could not be proven stable during validation."
            exit 1
          fi

      - name: Publish sanitized summary
        if: ${{ always() }}
        env:
          TARGET_MODE: ${{ inputs.mode || 'baseline' }}
        run: |
          set -Eeuo pipefail

          {
            echo "## Private CI"
            echo
            echo "Target alias: ${{ matrix.target }}"
            echo "Mode: ${TARGET_MODE}"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ -f "${RUNNER_TEMP}/ci-summary.md" ]]; then
            cat "${RUNNER_TEMP}/ci-summary.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "CI summary was not produced." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Cleanup private workspace
        if: ${{ always() }}
        run: |
          set +e
          rm -rf workspace
          rm -rf "${RUNNER_TEMP}/private-ci-command-files"
          rm -f "${RUNNER_TEMP}"/automation-hub-*.log \
            "${RUNNER_TEMP}/ci-summary.md" \
            "${RUNNER_TEMP}/automation-hub-git-askpass.sh" \
            "${RUNNER_TEMP}/private-repo-*.json" \
            "${RUNNER_TEMP}/private-repo.tar.gz" \
            "${RUNNER_TEMP}/private-pr-head.sha"
          exit 0

      - name: Fail workflow when private CI failed
        if: ${{ steps.private_ci.outcome == 'failure' || steps.pr_stability.outcome == 'failure' }}
        run: |
          echo "::error title=Private CI failed::One or more repository-native CI stages failed or could not prove the requested revision."
          exit 1
