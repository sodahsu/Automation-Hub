name: 排程探針 v2

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/schedule-probe-v2.yml'

permissions:
  contents: read

jobs:
  probe:
    name: GitHub scheduler probe v2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 確認觸發事件
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "sha=${GITHUB_SHA}"
          date -u
