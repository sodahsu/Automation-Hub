name: 排程探針

on:
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: GitHub scheduler probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 確認排程事件
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "sha=${GITHUB_SHA}"
          date -u
