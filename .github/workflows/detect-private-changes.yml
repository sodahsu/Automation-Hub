# 由外部 scheduler 每 5 分鐘以 workflow_dispatch 喚醒；GitHub 原生 schedule 實測幾乎不觸發，且與外部喚醒互相 cancel，故移除。
# 只對尚未被 Public CI 涵蓋的新 push dispatch 對應 alias。
name: Detect Private Repository Changes

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass 5-minute detector throttle"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - '.github/workflows/detect-private-changes.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: private-change-detector
  cancel-in-progress: true

jobs:
  detect:
    name: Detect and dispatch changed aliases
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Detect private push activity
        env:
          PRIVATE_REPOS_JSON: ${{ secrets.PRIVATE_REPOS_JSON }}
          PRIVATE_REPOS_READ_TOKEN: ${{ secrets.PRIVATE_REPOS_READ_TOKEN }}
          HUB_TOKEN: ${{ github.token }}
          FORCE_DETECT: ${{ inputs.force }}
        run: |
          set -Eeuo pipefail
          umask 077

          # 外部 scheduler 的正式契約是每 5 分鐘。
          # workflow_dispatch 若未明確 force，只在 UTC 分鐘為 5 的倍數時做完整掃描；
          # 其餘喚醒（例如手動或 scheduler 偏移造成的非格點喚醒）立即結束，不讀 private API、不 dispatch CI。
          # force=true 繞過此節流，Ai-agent 的 hub-ci-kick hook 依賴這個語意。
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${FORCE_DETECT:-false}" != "true" ]]; then
            minute="$(date -u +%M)"
            if (( 10#${minute} % 5 != 0 )); then
              {
                echo "## Private CI change detector"
                echo
                echo "SKIP — early wake throttled; full detection runs every 5 minutes."
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
          fi

          if [[ -z "${PRIVATE_REPOS_JSON}" ]]; then
            echo "::error title=Missing secret::Private repository mapping is not configured."
            exit 1
          fi

          if [[ -z "${PRIVATE_REPOS_READ_TOKEN}" ]]; then
            echo "::error title=Missing secret::Private repository read credential is not configured."
            exit 1
          fi

          if ! jq -e 'type == "object"' >/dev/null <<<"${PRIVATE_REPOS_JSON}"; then
            echo "::error title=Invalid secret::Private repository mapping must be a JSON object."
            exit 1
          fi

          aliases=(repo-01 repo-02 repo-03 repo-04 repo-05 repo-06)
          runs_file="${RUNNER_TEMP}/private-ci-runs.json"

          runs_code="$(curl --silent --location             --output "${runs_file}"             --write-out "%{http_code}"             --header "Accept: application/vnd.github+json"             --header "Authorization: Bearer ${HUB_TOKEN}"             --header "X-GitHub-Api-Version: 2026-03-10"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/private-ci.yml/runs?per_page=100")"

          if [[ "${runs_code}" != "200" ]]; then
            rm -f "${runs_file}"
            echo "::error title=Hub history unavailable::Unable to read prior CI history (HTTP ${runs_code})."
            exit 1
          fi

          declare -A latest_status
          declare -A latest_conclusion
          declare -A latest_started

          while IFS= read -r run_id; do
            [[ -n "${run_id}" ]] || continue
            jobs_file="${RUNNER_TEMP}/jobs-${run_id}.json"

            jobs_code="$(curl --silent --location               --output "${jobs_file}"               --write-out "%{http_code}"               --header "Accept: application/vnd.github+json"               --header "Authorization: Bearer ${HUB_TOKEN}"               --header "X-GitHub-Api-Version: 2026-03-10"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"

            if [[ "${jobs_code}" != "200" ]]; then
              rm -f "${jobs_file}"
              echo "::error title=Hub history unavailable::Unable to read prior CI jobs (HTTP ${jobs_code})."
              exit 1
            fi

            while IFS=$'\t' read -r alias status conclusion started_at; do
              [[ -n "${alias}" ]] || continue
              if [[ -z "${latest_status[${alias}]:-}" ]]; then
                latest_status["${alias}"]="${status}"
                latest_conclusion["${alias}"]="${conclusion}"
                latest_started["${alias}"]="${started_at}"
              fi
            done < <(
              jq -r '
                .jobs[]
                | select(.name | test("^CI — repo-0[1-6]$"))
                | [
                    (.name | sub("^CI — "; "")),
                    .status,
                    (.conclusion // ""),
                    (.started_at // "")
                  ]
                | @tsv
              ' "${jobs_file}"
            )

            rm -f "${jobs_file}"

            found=0
            for alias in "${aliases[@]}"; do
              [[ -n "${latest_status[${alias}]:-}" ]] && ((found += 1)) || true
            done
            (( found == 6 )) && break
          done < <(jq -r '.workflow_runs[].id' "${runs_file}")

          rm -f "${runs_file}"

          {
            echo "## Private CI change detector"
            echo
            echo "| Target | Decision |"
            echo "|---|---|"
          } >> "${GITHUB_STEP_SUMMARY}"

          dispatched=0

          for alias in "${aliases[@]}"; do
            private_repo="$(jq -er --arg alias "${alias}" '.[$alias] | select(type == "string" and length > 0)' <<<"${PRIVATE_REPOS_JSON}")"

            if [[ ! "${private_repo}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "::error title=Invalid target mapping::${alias} does not resolve to a valid repository identifier."
              exit 1
            fi

            echo "::add-mask::${private_repo}"

            meta_file="${RUNNER_TEMP}/meta-${alias}.json"
            meta_code="$(curl --silent --location               --output "${meta_file}"               --write-out "%{http_code}"               --header "Accept: application/vnd.github+json"               --header "Authorization: Bearer ${PRIVATE_REPOS_READ_TOKEN}"               --header "X-GitHub-Api-Version: 2026-03-10"               "https://api.github.com/repos/${private_repo}")"

            if [[ "${meta_code}" != "200" ]]; then
              rm -f "${meta_file}"
              echo "::error title=Private metadata check failed::${alias} metadata lookup failed with HTTP ${meta_code}."
              exit 1
            fi

            pushed_at="$(jq -r '.pushed_at // empty' "${meta_file}")"
            rm -f "${meta_file}"

            if [[ -z "${pushed_at}" ]]; then
              echo "::error title=Private metadata check failed::${alias} has no usable push timestamp."
              exit 1
            fi

            status="${latest_status[${alias}]:-none}"
            conclusion="${latest_conclusion[${alias}]:-}"
            started_at="${latest_started[${alias}]:-}"

            if [[ "${status}" != "none" && "${status}" != "completed" ]]; then
              echo "| ${alias} | WAIT — CI in progress; recheck next poll |" >> "${GITHUB_STEP_SUMMARY}"
              continue
            fi

            if [[ -n "${started_at}" && ( "${started_at}" > "${pushed_at}" || "${started_at}" == "${pushed_at}" ) ]]; then
              if [[ "${conclusion}" == "success" ]]; then
                echo "| ${alias} | SKIP — successful CI covers latest push |" >> "${GITHUB_STEP_SUMMARY}"
                continue
              elif [[ "${conclusion}" == "failure" || "${conclusion}" == "timed_out" ]]; then
                echo "| ${alias} | FAIL — latest push CI failed; not covered |" >> "${GITHUB_STEP_SUMMARY}"
                continue
              fi
            fi

            payload="$(jq -cn --arg ref "main" --arg target "${alias}" '{ref:$ref,inputs:{target:$target}}')"
            dispatch_file="${RUNNER_TEMP}/dispatch-${alias}.txt"

            dispatch_code="$(curl --silent --location               --output "${dispatch_file}"               --write-out "%{http_code}"               --request POST               --header "Accept: application/vnd.github+json"               --header "Authorization: Bearer ${HUB_TOKEN}"               --header "X-GitHub-Api-Version: 2026-03-10"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/private-ci.yml/dispatches"               --data "${payload}")"

            rm -f "${dispatch_file}"

            if [[ ! "${dispatch_code}" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error title=CI dispatch failed::Unable to dispatch ${alias} (HTTP ${dispatch_code})."
              exit 1
            fi

            ((dispatched += 1))
            echo "| ${alias} | RUN — new push detected |" >> "${GITHUB_STEP_SUMMARY}"
          done

          echo >> "${GITHUB_STEP_SUMMARY}"
          echo "Dispatched targets: ${dispatched}" >> "${GITHUB_STEP_SUMMARY}"

          # PR head 驗證：只涵蓋 repo-01～05（repo-06 是 main-only 知識庫）。
          # 單一 alias 的 PR 查詢失敗只記錄並繼續，最後才讓 step 失敗，
          # 避免上面已完成的 default branch dispatch 因此被整段蓋掉。
          {
            echo
            echo "## Pull request head verification"
            echo
            echo "| Target | Decision |"
            echo "|---|---|"
          } >> "${GITHUB_STEP_SUMMARY}"

          pr_failures=0

          for alias in "${aliases[@]}"; do
            [[ "${alias}" == "repo-06" ]] && continue

            private_repo="$(jq -er --arg alias "${alias}" '.[$alias]' <<<"${PRIVATE_REPOS_JSON}")"
            echo "::add-mask::${private_repo}"

            pulls_file="${RUNNER_TEMP}/pulls-${alias}.json"
            pulls_code="$(curl --silent --location               --output "${pulls_file}"               --write-out "%{http_code}"               --header "Accept: application/vnd.github+json"               --header "Authorization: Bearer ${PRIVATE_REPOS_READ_TOKEN}"               --header "X-GitHub-Api-Version: 2026-03-10"               "https://api.github.com/repos/${private_repo}/pulls?state=open&per_page=50")"

            if [[ "${pulls_code}" != "200" ]]; then
              rm -f "${pulls_file}"
              echo "::error title=Private PR check failed::${alias} pull request lookup failed with HTTP ${pulls_code}."
              echo "| ${alias} | ERROR — PR lookup failed |" >> "${GITHUB_STEP_SUMMARY}"
              ((pr_failures += 1))
              continue
            fi

            head_shas="$(jq -r '.[] | select(.draft == false) | .head.sha' "${pulls_file}")"
            rm -f "${pulls_file}"

            pr_run=0
            pr_skip=0
            alias_failed=0

            while IFS= read -r head_sha; do
              [[ -n "${head_sha}" ]] || continue

              if [[ ! "${head_sha}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error title=Private PR check failed::${alias} returned an unexpected head identifier."
                alias_failed=1
                continue
              fi

              status_file="${RUNNER_TEMP}/commit-status-${alias}.json"
              status_code="$(curl --silent --location                 --output "${status_file}"                 --write-out "%{http_code}"                 --header "Accept: application/vnd.github+json"                 --header "Authorization: Bearer ${PRIVATE_REPOS_READ_TOKEN}"                 --header "X-GitHub-Api-Version: 2026-03-10"                 "https://api.github.com/repos/${private_repo}/commits/${head_sha}/status")"

              if [[ "${status_code}" != "200" ]]; then
                rm -f "${status_file}"
                echo "::error title=Private PR check failed::${alias} commit status lookup failed with HTTP ${status_code}."
                alias_failed=1
                continue
              fi

              has_status="$(jq -r '[.statuses[]? | select(.context == "automation-hub/private-ci")] | length' "${status_file}")"
              rm -f "${status_file}"

              if [[ "${has_status}" != "0" ]]; then
                ((pr_skip += 1))
                continue
              fi

              payload="$(jq -cn --arg ref "main" --arg target "${alias}" --arg sha "${head_sha}" '{ref:$ref,inputs:{target:$target,sha:$sha}}')"
              dispatch_file="${RUNNER_TEMP}/dispatch-pr-${alias}.txt"

              dispatch_code="$(curl --silent --location                 --output "${dispatch_file}"                 --write-out "%{http_code}"                 --request POST                 --header "Accept: application/vnd.github+json"                 --header "Authorization: Bearer ${HUB_TOKEN}"                 --header "X-GitHub-Api-Version: 2026-03-10"                 "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/private-ci.yml/dispatches"                 --data "${payload}")"

              rm -f "${dispatch_file}"

              if [[ ! "${dispatch_code}" =~ ^2[0-9][0-9]$ ]]; then
                echo "::error title=CI dispatch failed::Unable to dispatch ${alias} PR verification (HTTP ${dispatch_code})."
                alias_failed=1
                continue
              fi

              ((pr_run += 1))
            done <<<"${head_shas}"

            ((alias_failed)) && ((pr_failures += 1))
            echo "| ${alias} | PR RUN ${pr_run} / PR SKIP ${pr_skip} |" >> "${GITHUB_STEP_SUMMARY}"
          done

          if (( pr_failures > 0 )); then
            echo "::error title=PR verification incomplete::${pr_failures} alias(es) had PR lookup or dispatch failures."
            exit 1
          fi
